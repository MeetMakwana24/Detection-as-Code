title: Suspicious PowerShell Encoded Command Execution
id: f3a5c8d0-4e8b-4b7f-9c2a-1d6e8f0a2b01
status: test
description: |
    Detects execution of PowerShell with encoded command parameters (-EncodedCommand,
    -enc, -ec). Attackers frequently encode commands in Base64 to evade static
    signature-based detection on the command line. Legitimate use exists but is
    uncommon outside of deployment automation.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
    - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe
author: Meet Makwana
date: 2026/10/13
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_encoded:
        CommandLine|contains:
            - '-encodedcommand'
            - '-EncodedCommand'
            - ' -enc '
            - ' -ec '
            - ' -enco '
    condition: selection_process and selection_encoded
falsepositives:
    - Legitimate administration scripts using encoded commands for safe transport
    - Configuration management tools (SCCM, Intune) that wrap commands in Base64
    - Some software installers that invoke encoded PowerShell during setup
level: high
