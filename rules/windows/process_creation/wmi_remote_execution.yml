title: WMI Remote Process Execution
id: 6d1b8f45-3a7e-4c90-b2d6-9e0f5a1c7b52
status: test
description: Detects WMI command-line process creation and shell processes spawned by the WMI provider.
references:
    - https://attack.mitre.org/techniques/T1047/
author: Meet Makwana
date: 2026/10/30
tags:
    - attack.execution
    - attack.lateral_movement
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'process'
            - 'call create'
    selection_wmiprvse_parent:
        ParentImage|endswith: '\wmiprvse.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection_wmic or selection_wmiprvse_parent
falsepositives:
    - Enterprise management platforms using WMI
    - Authorized remote-administration activity
level: high
