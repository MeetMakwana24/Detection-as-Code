title: Windows Event Log Clearing
id: 7b2d5e80-1c94-4f68-b3a7-0e6c9d4f2a15
status: test
description: Detects common command-line methods used to clear Windows event logs and hinder forensic investigation.
references:
    - https://attack.mitre.org/techniques/T1070/001/
author: Meet Makwana
date: 2026/10/30
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_wevtutil:
        Image|endswith: '\wevtutil.exe'
        CommandLine|contains:
            - ' cl '
            - ' clear-log '
    selection_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Clear-EventLog'
            - 'Remove-EventLog'
    condition: selection_wevtutil or selection_powershell
falsepositives:
    - Approved log-maintenance procedures
level: high
