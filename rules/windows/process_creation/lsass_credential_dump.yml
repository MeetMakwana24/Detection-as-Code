title: LSASS Credential Dumping via Known Tools
id: c7d9e1f3-5a2b-4c8d-ae6f-3b7c9d1e4f02
status: test
description: |
    Detects process creation events associated with LSASS credential dumping.
    Covers well-known techniques including ProcDump targeting lsass.exe,
    rundll32 loading comsvcs.dll MiniDump, and Mimikatz-related command patterns.
    LSASS holds plaintext passwords, Kerberos tickets, and NTLM hashes in memory.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://docs.microsoft.com/en-us/sysinternals/downloads/procdump
    - https://lolbas-project.github.io/#/lolbas/Libraries/comsvcs.dll
author: Meet Makwana
date: 2026/10/13
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_procdump:
        Image|endswith: '\procdump.exe'
        CommandLine|contains:
            - 'lsass'
    selection_comsvcs:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    selection_mimikatz:
        CommandLine|contains:
            - 'sekurlsa'
            - 'logonpasswords'
    selection_mimikatz_binary:
        Image|endswith:
            - '\mimikatz.exe'
    selection_nanodump_binary:
        Image|endswith:
            - '\nanodump.exe'
    condition: selection_procdump or selection_comsvcs or selection_mimikatz or selection_mimikatz_binary or selection_nanodump_binary
falsepositives:
    - Legitimate use of ProcDump for application crash diagnostics (rarely targeting lsass)
    - EDR or antivirus products that inspect LSASS memory
level: critical
